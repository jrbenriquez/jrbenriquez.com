services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: jrbenriquez.settings.production
      DATABASE_URL: sqlite:////app/data/db.sqlite3
    env_file:
      - path: .env.production
        required: false
    volumes:
      - blog_data:/app/data
      - blog_backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  blog_data:
  blog_backups:
